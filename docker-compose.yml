services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  echo-service:
    build:
      context: .
      dockerfile: Dockerfile.demo-service
    command: ["python", "-m", "demo_services.echo.server"]
    environment:
      GRPC_PORT: "60051"
      FAILURE_RATE: "0"
      EXTRA_LATENCY_MS: "0"
    ports:
      - "60051:60051"

  greeter-service:
    build:
      context: .
      dockerfile: Dockerfile.demo-service
    command: ["python", "-m", "demo_services.greeter.server"]
    environment:
      GRPC_PORT: "60052"
      FAILURE_RATE: "0"
      EXTRA_LATENCY_MS: "0"
    ports:
      - "60052:60052"

  gateway-1:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      REDIS_URL: "redis://redis:6379"
      ECHO_UPSTREAM_ADDR: "echo-service:60051"
      GREETER_UPSTREAM_ADDR: "greeter-service:60052"
      GRPC_PORT: "50051"
      METRICS_PORT: "9101"
      POLICY_CONFIG_PATH: "gateway/config/policies.yaml"
    ports:
      - "50051:50051"
      - "9101:9101"
    depends_on:
      - redis
      - echo-service
      - greeter-service

  gateway-2:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      REDIS_URL: "redis://redis:6379"
      ECHO_UPSTREAM_ADDR: "echo-service:60051"
      GREETER_UPSTREAM_ADDR: "greeter-service:60052"
      GRPC_PORT: "50052"
      METRICS_PORT: "9102"
      POLICY_CONFIG_PATH: "gateway/config/policies.yaml"
    ports:
      - "50052:50052"
      - "9102:9102"
    depends_on:
      - redis
      - echo-service
      - greeter-service

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway-1
      - gateway-2

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
