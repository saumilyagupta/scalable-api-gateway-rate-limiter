[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["gateway/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["gateway", "demo_services"]
omit = ["gateway/generated/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
